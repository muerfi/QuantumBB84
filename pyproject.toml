[build-system]
requires = []
build-backend = "quantum_bb84_build"
backend-path = ["."]

[project]
name = "quantum-bb84"
version = "0.1.0"
description = "Quantum Key Distribution Simulation Lab for BB84 and simplified E91 finite-shot simulations"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "QuantumBB84 contributors" }]
keywords = ["quantum-key-distribution", "bb84", "e91", "qiskit", "simulation", "education"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Education",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = []

[project.optional-dependencies]
qiskit = ["qiskit>=0.44"]
plot = ["matplotlib>=3.7"]
dev = ["pytest>=7"]

[project.scripts]
quantum-bb84 = "quantum_bb84.cli:main"
